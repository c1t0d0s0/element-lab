    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Google Tag Manager / Google Analytics (Config Loader) -->
    <script src="./config.js"></script>
    <script>
      (function() {
        var rawId = typeof GTM_ID !== 'undefined' ? GTM_ID : (typeof window.GTM_ID !== 'undefined' ? window.GTM_ID : '');
        var tagId = String(rawId || '').trim().toUpperCase();
        if (!tagId) return;

        if (/^GTM-[A-Z0-9]+$/.test(tagId)) {
          // Google Tag Manager
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+encodeURIComponent(i)+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer',tagId);
        } else if (/^[A-Z]+-[A-Z0-9-]+$/.test(tagId)) {
          // Google Tag (gtag.js) for Google Analytics (G-XXXX) etc.
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(tagId);
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', tagId);
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="top-bar"></header>
      
      <main id="main-area">

        <div id="inspector-container"></div>
        <div id="toast-container"></div>
      </main>

      <footer id="bottom-bar"></footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

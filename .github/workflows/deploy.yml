name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npx tsx tests/simulation_test.ts

      - name: Configure GTM_ID from repository variable
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
        run: |
          if [ -n "$GTM_ID" ]; then
            echo "Applying GTM_ID from repository variable/secret..."
            printf "const GTM_ID = '%s';\nif (typeof window !== 'undefined') {\n  window.GTM_ID = GTM_ID;\n}\n" "$GTM_ID" > config.js
            mkdir -p public
            cp config.js public/config.js
          else
            echo "No repository GTM_ID provided; skipping config.js generation."
          fi

      - name: Build project
        run: npm run build

      - name: Ensure config.js is in dist
        run: |
          if [ -f config.js ]; then
            cp config.js dist/config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
